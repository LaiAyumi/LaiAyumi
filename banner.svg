<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect width="1200" height="180" fill="#0D1117"/>

  <!-- stars -->
  <g fill="#E6EDF3">
    <rect x="40" y="20" width="6" height="6"/>
    <rect x="140" y="50" width="6" height="6"/>
    <rect x="260" y="24" width="6" height="6"/>
    <rect x="360" y="60" width="6" height="6"/>
    <rect x="480" y="18" width="6" height="6"/>
    <rect x="600" y="46" width="6" height="6"/>
    <rect x="720" y="22" width="6" height="6"/>
    <rect x="840" y="56" width="6" height="6"/>
    <rect x="960" y="20" width="6" height="6"/>
    <rect x="1080" y="48" width="6" height="6"/>
    <rect x="1150" y="26" width="6" height="6"/>
  </g>

  <!-- pixel clouds -->
  <g fill="#8B949E">
    <rect x="90" y="70" width="20" height="20"/>
    <rect x="110" y="70" width="20" height="20"/>
    <rect x="70" y="90" width="80" height="20"/>

    <rect x="820" y="40" width="20" height="20"/>
    <rect x="840" y="40" width="20" height="20"/>
    <rect x="800" y="60" width="80" height="20"/>
  </g>

  <!-- ? blocks -->
  <g>
    <rect x="360" y="60" width="40" height="40" fill="#E3A008" stroke="#0D1117" stroke-width="2"/>
    <text x="380" y="90" font-family="monospace" font-size="22" font-weight="bold" fill="#0D1117" text-anchor="middle">?</text>

    <rect x="900" y="80" width="40" height="40" fill="#E3A008" stroke="#0D1117" stroke-width="2"/>
    <text x="920" y="110" font-family="monospace" font-size="22" font-weight="bold" fill="#0D1117" text-anchor="middle">?</text>
  </g>

  <!-- pipe -->
  <g fill="#2EA043">
    <rect x="1060" y="80" width="60" height="20"/>
    <rect x="1070" y="100" width="40" height="60"/>
  </g>

  <!-- ground -->
  <g>
    <rect x="0" y="160" width="1200" height="20" fill="#8B5A2B"/>
    <g fill="#6E4423">
      <rect x="0" y="160" width="20" height="20"/>
      <rect x="40" y="160" width="20" height="20"/>
      <rect x="80" y="160" width="20" height="20"/>
      <rect x="120" y="160" width="20" height="20"/>
      <rect x="160" y="160" width="20" height="20"/>
      <rect x="200" y="160" width="20" height="20"/>
      <rect x="240" y="160" width="20" height="20"/>
      <rect x="280" y="160" width="20" height="20"/>
      <rect x="320" y="160" width="20" height="20"/>
      <rect x="360" y="160" width="20" height="20"/>
      <rect x="400" y="160" width="20" height="20"/>
      <rect x="440" y="160" width="20" height="20"/>
      <rect x="480" y="160" width="20" height="20"/>
      <rect x="520" y="160" width="20" height="20"/>
      <rect x="560" y="160" width="20" height="20"/>
      <rect x="600" y="160" width="20" height="20"/>
      <rect x="640" y="160" width="20" height="20"/>
      <rect x="680" y="160" width="20" height="20"/>
      <rect x="720" y="160" width="20" height="20"/>
      <rect x="760" y="160" width="20" height="20"/>
      <rect x="800" y="160" width="20" height="20"/>
      <rect x="840" y="160" width="20" height="20"/>
      <rect x="880" y="160" width="20" height="20"/>
      <rect x="920" y="160" width="20" height="20"/>
      <rect x="960" y="160" width="20" height="20"/>
      <rect x="1000" y="160" width="20" height="20"/>
      <rect x="1040" y="160" width="20" height="20"/>
      <rect x="1080" y="160" width="20" height="20"/>
      <rect x="1120" y="160" width="20" height="20"/>
      <rect x="1160" y="160" width="20" height="20"/>
    </g>
  </g>

  <!-- title, pixel-style monospace -->
  <text x="600" y="132" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">LAÍSSA AYUMI</text>
</svg>
