<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect width="1200" height="220" fill="#0B1026"/>

  <!-- moon -->
  <g fill="#F4EFC1">
    <rect x="1084" y="24" width="52" height="52"/>
  </g>
  <g fill="#D9CE9A">
    <rect x="1096" y="36" width="8" height="8"/>
    <rect x="1112" y="52" width="8" height="8"/>
  </g>

  <!-- stars, twinkling -->
  <g fill="#E6EDF3">
    <rect x="40" y="20" width="5" height="5"><animate attributeName="opacity" values="1;0.15;1" dur="1.8s" begin="0s" repeatCount="indefinite"/></rect>
    <rect x="140" y="50" width="5" height="5"><animate attributeName="opacity" values="1;0.15;1" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="260" y="24" width="5" height="5"><animate attributeName="opacity" values="1;0.15;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="60" y="120" width="5" height="5"><animate attributeName="opacity" values="1;0.15;1" dur="2s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="480" y="18" width="5" height="5"><animate attributeName="opacity" values="1;0.15;1" dur="1.9s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="600" y="140" width="5" height="5"><animate attributeName="opacity" values="1;0.15;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="720" y="22" width="5" height="5"><animate attributeName="opacity" values="1;0.15;1" dur="1.7s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="340" y="160" width="5" height="5"><animate attributeName="opacity" values="1;0.15;1" dur="2.1s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="960" y="120" width="5" height="5"><animate attributeName="opacity" values="1;0.15;1" dur="1.8s" begin="0.9s" repeatCount="indefinite"/></rect>
    <rect x="200" y="60" width="5" height="5"><animate attributeName="opacity" values="1;0.15;1" dur="2.3s" begin="0.5s" repeatCount="indefinite"/></rect>
    <rect x="1000" y="30" width="5" height="5"><animate attributeName="opacity" values="1;0.15;1" dur="1.9s" begin="0.1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Toothless, flying left to right -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-130,30; 1230,30" dur="11s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="1.1s" repeatCount="indefinite"/>
      <g fill="#181818">
        <rect x="46" y="6" width="34" height="8"/>
        <rect x="40" y="14" width="30" height="8"/>
        <rect x="36" y="22" width="26" height="8">
          <animateTransform attributeName="transform" type="scale" values="1,1; 1,0.4; 1,1" dur="0.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="70" y="0" width="8" height="16"/>
        <rect x="84" y="0" width="8" height="16"/>
        <rect x="64" y="16" width="40" height="20"/>
        <rect x="104" y="24" width="14" height="10"/>
        <rect x="40" y="30" width="50" height="22"/>
        <rect x="46" y="52" width="38" height="10"/>
        <rect x="16" y="40" width="30" height="8"/>
        <rect x="6" y="32" width="12" height="10"/>
        <rect x="6" y="48" width="12" height="10"/>
      </g>
      <rect x="88" y="22" width="8" height="8" fill="#7FFF6B"/>
    </g>
  </g>

  <!-- Light Fury, flying left to right, offset -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-130,90; 1230,90" dur="13s" begin="1.4s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="1s" begin="0.3s" repeatCount="indefinite"/>
      <g fill="#EAF2F7">
        <rect x="46" y="6" width="34" height="8"/>
        <rect x="40" y="14" width="30" height="8"/>
        <rect x="70" y="0" width="8" height="16"/>
        <rect x="84" y="0" width="8" height="16"/>
        <rect x="64" y="16" width="40" height="20"/>
        <rect x="104" y="24" width="14" height="10"/>
        <rect x="40" y="30" width="50" height="22"/>
        <rect x="46" y="52" width="38" height="10"/>
        <rect x="16" y="40" width="30" height="8"/>
        <rect x="6" y="32" width="12" height="10"/>
        <rect x="6" y="48" width="12" height="10"/>
      </g>
      <g fill="#D9AEE0">
        <rect x="36" y="22" width="26" height="8">
          <animateTransform attributeName="transform" type="scale" values="1,1; 1,0.4; 1,1" dur="0.45s" repeatCount="indefinite"/>
        </rect>
      </g>
      <rect x="88" y="22" width="8" height="8" fill="#4FA8D8"/>
    </g>
  </g>

  <!-- title -->
  <text x="600" y="196" font-family="'Courier New', monospace" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">LAÍSSA AYUMI</text>
</svg>
